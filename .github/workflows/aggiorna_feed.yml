name: Aggiorna e Traduci Feed RSS Multipli

on:
  schedule:
    - cron: '0 */6 * * *'  # Esegue l'aggiornamento ogni 6 ore
  workflow_dispatch:       # Consente l'avvio manuale tramite pulsante

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # Scarica la cronologia completa per evitare conflitti

      - name: Configurazione ambiente Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests deep-translator

      - name: Esecuzione script di traduzione
        run: python script.py

      - name: Commit e Push dei file XML aggiornati
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xml
          git commit -m "Aggiornamento automatico feed XML tradotti" || exit 0
          git pull --rebase origin main
          git push
